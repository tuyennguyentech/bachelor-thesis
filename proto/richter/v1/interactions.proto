syntax = "proto3";

package richter.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "example.com/buf/gen/richter/v1;richterv1";

// ── Enums ─────────────────────────────────────────────────────────────────────

enum FeedbackMode {
  FEEDBACK_MODE_UNSPECIFIED = 0;
  // Correct answers are never revealed to students.
  FEEDBACK_MODE_HIDDEN = 1;
  // Correct answers are revealed only after the student submits their attempt.
  FEEDBACK_MODE_AFTER_SUBMIT = 2;
  // Correct answers are revealed immediately after each interaction is answered.
  FEEDBACK_MODE_AFTER_EACH = 3;
}

enum InteractionKind {
  INTERACTION_KIND_UNSPECIFIED = 0;
  INTERACTION_KIND_SINGLE_CHOICE = 1;
  INTERACTION_KIND_FILL_BLANK = 2;
  INTERACTION_KIND_LISTENING = 3;
  INTERACTION_KIND_READING = 4;
  INTERACTION_KIND_MULTIPLE_CHOICE = 5;
}

enum ListeningMode {
  LISTENING_MODE_UNSPECIFIED = 0;
  LISTENING_MODE_DICTATION = 1;
  LISTENING_MODE_COMPREHENSION = 2;
}

enum ReadingMode {
  READING_MODE_UNSPECIFIED = 0;
  // Student reads the passage aloud; AI grades pronunciation.
  READING_MODE_PRONUNCIATION = 1;
  // Student speaks an answer to a question; AI grades content + pronunciation.
  READING_MODE_OPEN_ANSWER = 2;
}

// ── MCQ config ────────────────────────────────────────────────────────────────

message McqOption {
  string text = 1;
}

message McqConfig {
  repeated McqOption options = 1;
  // correct_answer is stripped (set to -1) for students before submission,
  // unless feedback_mode == AFTER_EACH. Server enforces this as defense-in-depth.
  int32 correct_answer = 2;
  // correct_answers is used for MULTIPLE_CHOICE (set to empty for students)
  repeated int32 correct_answers = 3;
  // Optional question text for nested MCQs, e.g. listening comprehension items.
  string question = 4;
}

// ── Fill-blank config ─────────────────────────────────────────────────────────

message Blank {
  repeated string accepted = 1 [(buf.validate.field).repeated.min_items = 1];
  bool case_sensitive = 2;
  string hint = 3;
}

message FillBlankConfig {
  // Template with {{i}} placeholders, e.g. "Năng lượng không thể {{0}} mà chỉ {{1}}."
  string template = 1 [(buf.validate.field).string.min_len = 1];
  repeated Blank blanks = 2 [(buf.validate.field).repeated.min_items = 1];
}

message FillBlankResponse {
  // Index aligns with FillBlankConfig.blanks
  repeated string answers = 1;
}

// ── Listening config ──────────────────────────────────────────────────────────

message ListeningConfig {
  // Storage object key — frontend fetches presigned download URL at render time
  string audio_object_key = 1 [(buf.validate.field).string.min_len = 1];
  int32 duration_seconds = 2;
  ListeningMode mode = 3;
  // DICTATION: expected verbatim text (used for grading)
  string expected_text = 4;
  // COMPREHENSION: nested MCQs about the audio
  repeated McqConfig comprehension_questions = 5;
}

message ListeningResponse {
  // DICTATION: student's transcription
  string transcription = 1;
  // COMPREHENSION: selected option index per comprehension_question (parallel array)
  repeated int32 comprehension_answers = 2;
}

// ── Reading config ────────────────────────────────────────────────────────────

message ReadingConfig {
  ReadingMode mode = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  // The passage to read aloud (used in both modes).
  string passage_markdown = 2 [(buf.validate.field).string.min_len = 1];
  // OPEN_ANSWER only: the question the student must answer verbally.
  string question = 3;
  // OPEN_ANSWER only: gold answer used by Gemini for content grading and
  // shown to the student after submit. Stripped from student-facing config.
  string expected_answer = 4;
}

message ReadingResponse {
  // Storage object key of the student's recorded audio.
  string audio_object_key = 1;
}

// ── LessonInteraction ─────────────────────────────────────────────────────────

message LessonInteraction {
  string id = 1;
  string lesson_id = 2;
  string chunk_id = 3;
  float start_seconds = 4;
  int32 order_index = 5;
  InteractionKind kind = 6;
  string prompt = 7;
  // explanation is stripped for students before submission (unless AFTER_EACH).
  string explanation = 8;
  float max_score = 9;
  string generated_by = 10;
  google.protobuf.Timestamp created_at = 11;
  oneof config {
    McqConfig mcq = 20;
    FillBlankConfig fill_blank = 21;
    ListeningConfig listening = 22;
    ReadingConfig reading = 23;
  }
}

// ── Attempt ───────────────────────────────────────────────────────────────────

message LessonAttempt {
  string id = 1;
  string lesson_id = 2;
  string user_id = 3;
  float total_score = 4;
  float max_score = 5;
  string status = 6;
  google.protobuf.Timestamp submitted_at = 7;
  repeated LessonAttemptResponse responses = 8;
  int32 attempt_count = 9;
}

message McqMultipleResponse {
  repeated int32 selected_indexes = 1;
}

message LessonAttemptResponse {
  string interaction_id = 1;
  float score = 2;
  float max_score = 3;
  string feedback = 4;
  oneof response {
    int32 mcq_selected = 20;
    FillBlankResponse fill_blank = 21;
    ListeningResponse listening = 22;
    ReadingResponse reading = 23;
    McqMultipleResponse mcq_multiple = 24;
  }
}

// ── InteractionService RPCs ───────────────────────────────────────────────────

message ListLessonInteractionsRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
  int32 limit = 2 [(buf.validate.field).int32 = {gte: 1, lte: 500}];
  int32 offset = 3 [(buf.validate.field).int32.gte = 0];
}

message ListLessonInteractionsResponse {
  repeated LessonInteraction interactions = 1;
}

message CreateManualInteractionRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
  string prompt = 2 [(buf.validate.field).string.min_len = 1];
  string explanation = 3;
  float start_seconds = 4 [(buf.validate.field).float.gte = 0];
  string chunk_id = 5;
  oneof config {
    McqConfig mcq = 20;
    FillBlankConfig fill_blank = 21;
    ListeningConfig listening = 22;
    ReadingConfig reading = 23;
  }
}

message CreateManualInteractionResponse {
  LessonInteraction interaction = 1;
}

message UpdateInteractionRequest {
  string interaction_id = 1 [(buf.validate.field).string.uuid = true];
  string prompt = 2 [(buf.validate.field).string.min_len = 1];
  string explanation = 3;
  float start_seconds = 4 [(buf.validate.field).float.gte = 0];
  oneof config {
    McqConfig mcq = 20;
    FillBlankConfig fill_blank = 21;
    ListeningConfig listening = 22;
    ReadingConfig reading = 23;
  }
}

message UpdateInteractionResponse {
  LessonInteraction interaction = 1;
}

message DeleteInteractionRequest {
  string interaction_id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteInteractionResponse {}

message DeleteLessonInteractionsRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
  // Optional. When set, only interactions attached to this chunk are deleted.
  string chunk_id = 2;
}

message DeleteLessonInteractionsResponse {}

// ── Regenerate single ─────────────────────────────────────────────────────────

message RegenerateInteractionRequest {
  string interaction_id = 1 [(buf.validate.field).string.uuid = true];
  // If unspecified, keep the existing kind.
  InteractionKind new_kind = 2;
  // Custom prompt / instructions to rewrite/edit the question with AI Magic.
  string custom_prompt = 3;
}

message RegenerateInteractionResponse {
  LessonInteraction interaction = 1;
}

// ── Submit / Get attempt ─────────────────────────────────────────────────────

message AttemptResponseInput {
  string interaction_id = 1 [(buf.validate.field).string.uuid = true];
  // Time the student took to answer this interaction, in milliseconds. Optional.
  int32 time_to_answer_ms = 2 [(buf.validate.field).int32.gte = 0];
  // Number of times the student replayed the video segment for this interaction.
  int32 replay_count = 3 [(buf.validate.field).int32.gte = 0];
  oneof response {
    int32 mcq_selected = 20;
    FillBlankResponse fill_blank = 21;
    ListeningResponse listening = 22;
    ReadingResponse reading = 23;
    McqMultipleResponse mcq_multiple = 24;
  }
}

message SubmitAttemptRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
  repeated AttemptResponseInput responses = 2 [(buf.validate.field).repeated.min_items = 1];
  // Fraction of the video watched before submitting (0..1). Optional.
  double video_watch_fraction = 3 [(buf.validate.field).double = {gte: 0, lte: 1}];
}

message SubmitAttemptResponse {
  LessonAttempt attempt = 1;
}

message GetMyAttemptRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetMyAttemptResponse {
  LessonAttempt attempt = 1;
}

message StudentAttemptSummary {
  string user_id = 1;
  string display_name = 2;
  string email = 3;
  float total_score = 4;
  float max_score = 5;
  google.protobuf.Timestamp submitted_at = 6;
  int32 attempt_count = 7;
  // Average time to answer across all responses, in milliseconds.
  double avg_time_to_answer_ms = 8;
  // Fraction of the lesson video the student watched (0..1).
  double video_watch_fraction = 9;
  // Composite engagement score (0..100).
  double engagement_score = 10;
}

message ListAttemptsRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
  int32 limit = 2 [(buf.validate.field).int32 = {gte: 1, lte: 100}];
  int32 offset = 3 [(buf.validate.field).int32.gte = 0];
}

message ListAttemptsResponse {
  repeated StudentAttemptSummary attempts = 1;
  int32 total = 2;
}

// Used by AFTER_EACH feedback for interactions where grading requires a server
// roundtrip (e.g. reading audio -> Gemini). The result is cached so SubmitAttempt
// can reuse it when the response has not changed.
message PreviewGradeRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
  AttemptResponseInput response = 2;
}

message PreviewGradeResponse {
  float score = 1;
  float max_score = 2;
  string feedback = 3;
}

// Saves and grades one in-progress response. The server may cache the real
// score/feedback for fast final submit, but only reveals them when feedback_mode
// permits per-question feedback.
message SaveAttemptResponseRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
  AttemptResponseInput response = 2;
}

message SaveAttemptResponseResponse {
  float score = 1;
  float max_score = 2;
  string feedback = 3;
  bool feedback_revealed = 4;
}

// ── Analytics ────────────────────────────────────────────────────────────────

// Per-student summary across all lessons in a course (teacher/admin view).
message CourseStudentSummary {
  string user_id = 1;
  string display_name = 2;
  string email = 3;
  // Number of distinct lessons this student has submitted an attempt for.
  int32 lessons_completed = 4;
  // Total number of lessons in the course.
  int32 lessons_total = 5;
  // Average score fraction across all submitted attempts (total_score / max_score).
  double avg_score = 6;
  // Composite engagement score (0..100).
  double engagement_score = 7;
  // Timestamp of the most recent attempt submission.
  google.protobuf.Timestamp last_active = 8;
}

message ListCourseAttemptsSummaryRequest {
  string course_id = 1 [(buf.validate.field).string.uuid = true];
  int32 limit = 2 [(buf.validate.field).int32 = {gte: 1, lte: 200}];
  int32 offset = 3 [(buf.validate.field).int32.gte = 0];
}

message ListCourseAttemptsSummaryResponse {
  repeated CourseStudentSummary students = 1;
  int64 total = 2;
}

// Per-course progress summary for the authenticated student (self-view).
message MyCourseProgress {
  string course_id = 1;
  string title = 2;
  // Number of distinct lessons the student has submitted at least one attempt for.
  int32 lessons_done = 3;
  // Total number of lessons in the course.
  int32 lessons_total = 4;
  // Average score fraction across all submitted attempts (0..1).
  double avg_score = 5;
}

message ListMyCourseProgressRequest {
  int32 limit = 1 [(buf.validate.field).int32 = {gte: 1, lte: 200}];
  int32 offset = 2 [(buf.validate.field).int32.gte = 0];
}

message ListMyCourseProgressResponse {
  repeated MyCourseProgress courses = 1;
}

service InteractionService {
  // Teacher: list all interactions for a lesson.
  rpc ListLessonInteractions(ListLessonInteractionsRequest) returns (ListLessonInteractionsResponse) {}
  // Teacher: create a manually authored interaction.
  rpc CreateManualInteraction(CreateManualInteractionRequest) returns (CreateManualInteractionResponse) {}
  // Teacher: edit an existing interaction.
  rpc UpdateInteraction(UpdateInteractionRequest) returns (UpdateInteractionResponse) {}
  // Teacher: delete an interaction.
  rpc DeleteInteraction(DeleteInteractionRequest) returns (DeleteInteractionResponse) {}
  // Teacher: delete all interactions in a lesson or in one transcript chunk.
  rpc DeleteLessonInteractions(DeleteLessonInteractionsRequest) returns (DeleteLessonInteractionsResponse) {}
  // Teacher: AI-regenerate a single interaction (same or new kind).
  rpc RegenerateInteraction(RegenerateInteractionRequest) returns (RegenerateInteractionResponse) {}
  // Teacher: list student attempt summaries for a lesson.
  rpc ListAttempts(ListAttemptsRequest) returns (ListAttemptsResponse) {}
  // Teacher/Admin: list per-student attempt summaries across an entire course.
  rpc ListCourseAttemptsSummary(ListCourseAttemptsSummaryRequest) returns (ListCourseAttemptsSummaryResponse) {}

  // Student: submit all interaction responses and receive a graded attempt.
  rpc SubmitAttempt(SubmitAttemptRequest) returns (SubmitAttemptResponse) {}
  // Student: retrieve a previously submitted attempt (may be nil if not yet submitted).
  rpc GetMyAttempt(GetMyAttemptRequest) returns (GetMyAttemptResponse) {}
  // Student: preview the grade for a single response. Used by AFTER_EACH
  // feedback mode when grading needs a server roundtrip (e.g. reading audio).
  rpc PreviewGrade(PreviewGradeRequest) returns (PreviewGradeResponse) {}
  // Student: save/grade one in-progress response so final submit can be fast.
  rpc SaveAttemptResponse(SaveAttemptResponseRequest) returns (SaveAttemptResponseResponse) {}
  // Student: list own course progress (courses where at least one lesson attempt exists).
  rpc ListMyCourseProgress(ListMyCourseProgressRequest) returns (ListMyCourseProgressResponse) {}
}
