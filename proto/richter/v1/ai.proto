syntax = "proto3";

package richter.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

enum AnalysisStatus {
  ANALYSIS_STATUS_UNSPECIFIED = 0;
  ANALYSIS_STATUS_PENDING = 1;
  ANALYSIS_STATUS_PROCESSING = 2;
  ANALYSIS_STATUS_DONE = 3;
  ANALYSIS_STATUS_ERROR = 4;
  // Stage 1 done: transcript + segments extracted; chunks not yet created.
  ANALYSIS_STATUS_TRANSCRIPT_EXTRACTED = 5;
  // Stage 2 done: chunks created; questions not yet generated.
  ANALYSIS_STATUS_CHUNKS_READY = 6;
}

message MCQOption {
  string text = 1;
}

message LessonQuestion {
  string id = 1;
  string lesson_id = 2;
  string question_text = 3;
  repeated MCQOption options = 4;
  int32 correct_answer = 5;
  string explanation = 6;
  int32 order_index = 7;
  google.protobuf.Timestamp created_at = 8;
  float start_seconds = 9;
  string chunk_id = 10;
}

message TranscriptSegment {
  float start_seconds = 1;
  float end_seconds = 2;
  string text = 3;
}

message LessonAnalysis {
  string lesson_id = 1;
  AnalysisStatus status = 2;
  string transcript = 3;
  string error_msg = 4;
  repeated LessonQuestion questions = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  repeated TranscriptSegment transcript_segments = 8;
}

message TranscriptChunk {
  string id = 1;
  string lesson_id = 2;
  int32 order_index = 3;
  float start_seconds = 4;
  float end_seconds = 5;
  string summary = 6;
  string transcript = 7;
  int32 question_count_config = 8;
  // Lexical-cohesion coverage score [0, 1] computed at chunking time and
  // refreshed when the chunk's segments change. Higher = chunk stays on one
  // topic. See coherence.go on the server for the exact formula.
  float coherence_score = 9;
}

message GetLessonAnalysisRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetLessonAnalysisResponse {
  LessonAnalysis analysis = 1;
  repeated TranscriptChunk chunks = 2;
}

enum AnalysisProgressStep {
  ANALYSIS_PROGRESS_STEP_UNSPECIFIED = 0;
  ANALYSIS_PROGRESS_STEP_DOWNLOADING = 1;
  ANALYSIS_PROGRESS_STEP_UPLOADING = 2;
  ANALYSIS_PROGRESS_STEP_ANALYZING = 3;
  ANALYSIS_PROGRESS_STEP_SAVING = 4;
  ANALYSIS_PROGRESS_STEP_DONE = 5;
  ANALYSIS_PROGRESS_STEP_ERROR = 6;
}

message AnalysisProgressEvent {
  AnalysisProgressStep step = 1;
  string message = 2;
}

// ── Step 2: Extract transcript ────────────────────────────────────────────────

message ExtractTranscriptRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
}

message ExtractTranscriptResponse {
  LessonAnalysis analysis = 1;
  repeated TranscriptChunk chunks = 2;
}

// ── Step 3: Edit transcript segments ─────────────────────────────────────────

message UpdateTranscriptSegmentRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
  int32 segment_index = 2 [(buf.validate.field).int32.gte = 0];
  string text = 3 [(buf.validate.field).string.min_len = 1];
}

message UpdateTranscriptSegmentResponse {
  TranscriptSegment segment = 1;
}

// ── Step 4: Chunk transcript ──────────────────────────────────────────────────

message ChunkTranscriptRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
}

// ── Step 5: Edit chunks ───────────────────────────────────────────────────────

message ListLessonTranscriptChunksRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
  int32 limit = 2 [(buf.validate.field).int32 = {gte: 1, lte: 1000}];
  int32 offset = 3 [(buf.validate.field).int32.gte = 0];
}

message ListLessonTranscriptChunksResponse {
  repeated TranscriptChunk chunks = 1;
}

message UpdateChunkConfigRequest {
  string chunk_id = 1 [(buf.validate.field).string.uuid = true];
  int32 question_count = 2 [(buf.validate.field).int32 = {gte: 1, lte: 20}];
}

message UpdateChunkConfigResponse {
  TranscriptChunk chunk = 1;
}

message MergeChunksRequest {
  // The chunk to keep (its id will be retained, boundaries expanded).
  string keep_chunk_id = 1 [(buf.validate.field).string.uuid = true];
  // The adjacent chunk to absorb and delete.
  string discard_chunk_id = 2 [(buf.validate.field).string.uuid = true];
}

message MergeChunksResponse {
  TranscriptChunk merged_chunk = 1;
}

message DeleteChunkRequest {
  string chunk_id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteChunkResponse {}

// ── Step 5c: Split a chunk at a transcript-segment boundary ─────────────────

message SplitChunkRequest {
  string chunk_id = 1 [(buf.validate.field).string.uuid = true];
  // The start_seconds of the segment at which to begin the second chunk.
  float split_at_seconds = 2 [(buf.validate.field).float.gt = 0];
}

message SplitChunkResponse {
  TranscriptChunk first_chunk = 1;
  TranscriptChunk second_chunk = 2;
}

// ── Step 5d: Adjust the shared boundary between two adjacent chunks ──────────

message AdjustChunkBoundaryRequest {
  string prev_chunk_id = 1 [(buf.validate.field).string.uuid = true];
  string next_chunk_id = 2 [(buf.validate.field).string.uuid = true];
  // New boundary in seconds; must be between prevChunk.startSeconds and nextChunk.endSeconds.
  float new_boundary_seconds = 3 [(buf.validate.field).float.gt = 0];
}

message AdjustChunkBoundaryResponse {
  TranscriptChunk prev_chunk = 1;
  TranscriptChunk next_chunk = 2;
}

// ── Step 7: Generate questions ────────────────────────────────────────────────

enum GenerateQuestionsStep {
  GENERATE_QUESTIONS_STEP_UNSPECIFIED = 0;
  GENERATE_QUESTIONS_STEP_CHUNK = 1;
  GENERATE_QUESTIONS_STEP_DONE = 2;
  GENERATE_QUESTIONS_STEP_ERROR = 3;
}

message GenerateQuestionsProgressEvent {
  GenerateQuestionsStep step = 1;
  string message = 2;
  int32 chunk_index = 3;
  int32 total_chunks = 4;
}

message GenerateQuestionsRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
  // If non-empty, regenerate only for this chunk.
  string chunk_id = 2;
  // If true, regenerate questions even for chunks that already have questions.
  bool force_regenerate = 3;
}

// ── Question editing ──────────────────────────────────────────────────────────

message UpdateLessonQuestionRequest {
  string question_id = 1 [(buf.validate.field).string.uuid = true];
  string question_text = 2 [(buf.validate.field).string.min_len = 1];
  repeated string options = 3 [(buf.validate.field).repeated.min_items = 2];
  int32 correct_answer = 4 [(buf.validate.field).int32.gte = 0];
  string explanation = 5;
  float start_seconds = 6 [(buf.validate.field).float.gte = 0];
}

message UpdateLessonQuestionResponse {
  LessonQuestion question = 1;
}

message CreateManualQuestionRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
  string question_text = 2 [(buf.validate.field).string.min_len = 1];
  repeated string options = 3 [(buf.validate.field).repeated.min_items = 2];
  int32 correct_answer = 4 [(buf.validate.field).int32.gte = 0];
  string explanation = 5;
  float start_seconds = 6 [(buf.validate.field).float.gte = 0];
}

message CreateManualQuestionResponse {
  LessonQuestion question = 1;
}

message DeleteLessonQuestionRequest {
  string question_id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteLessonQuestionResponse {}

message RegenerateQuestionRequest {
  string question_id = 1 [(buf.validate.field).string.uuid = true];
}

message RegenerateQuestionResponse {
  LessonQuestion question = 1;
}

// ── Video watch progress (stored in FoundationDB) ─────────────────────────────

message UpdateWatchProgressRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
  // Current playback position in seconds.
  float position_seconds = 2 [(buf.validate.field).float.gte = 0];
}

message UpdateWatchProgressResponse {}

message GetWatchProgressRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetWatchProgressResponse {
  // Last saved playback position in seconds. 0 if no progress recorded.
  float position_seconds = 1;
}

service AIService {
  rpc GetLessonAnalysis(GetLessonAnalysisRequest) returns (GetLessonAnalysisResponse) {}

  // Step 2: Extract transcript + fine segments from video.
  rpc ExtractTranscriptStream(ExtractTranscriptRequest) returns (stream AnalysisProgressEvent) {}

  // Step 3: Edit a single transcript segment (text only; boundaries unchanged).
  rpc UpdateTranscriptSegment(UpdateTranscriptSegmentRequest) returns (UpdateTranscriptSegmentResponse) {}

  // Step 4: Chunk the transcript into topical sections (text-only Gemini call, no video re-upload).
  rpc ChunkTranscriptStream(ChunkTranscriptRequest) returns (stream AnalysisProgressEvent) {}

  // Step 5: Edit chunk configuration.
  rpc ListLessonTranscriptChunks(ListLessonTranscriptChunksRequest) returns (ListLessonTranscriptChunksResponse) {}
  rpc UpdateChunkConfig(UpdateChunkConfigRequest) returns (UpdateChunkConfigResponse) {}
  rpc MergeChunks(MergeChunksRequest) returns (MergeChunksResponse) {}
  rpc DeleteChunk(DeleteChunkRequest) returns (DeleteChunkResponse) {}
  rpc SplitChunk(SplitChunkRequest) returns (SplitChunkResponse) {}
  rpc AdjustChunkBoundary(AdjustChunkBoundaryRequest) returns (AdjustChunkBoundaryResponse) {}

  // Step 7: Generate MCQ questions for all chunks (or re-generate for one chunk).
  rpc GenerateQuestionsStream(GenerateQuestionsRequest) returns (stream GenerateQuestionsProgressEvent) {}

  // Step 8: Question editing.
  rpc UpdateLessonQuestion(UpdateLessonQuestionRequest) returns (UpdateLessonQuestionResponse) {}
  rpc CreateManualQuestion(CreateManualQuestionRequest) returns (CreateManualQuestionResponse) {}
  rpc DeleteLessonQuestion(DeleteLessonQuestionRequest) returns (DeleteLessonQuestionResponse) {}
  rpc RegenerateQuestion(RegenerateQuestionRequest) returns (RegenerateQuestionResponse) {}

  // Video watch progress — stored in FoundationDB, not PostgreSQL.
  rpc UpdateWatchProgress(UpdateWatchProgressRequest) returns (UpdateWatchProgressResponse) {}
  rpc GetWatchProgress(GetWatchProgressRequest) returns (GetWatchProgressResponse) {}
}
