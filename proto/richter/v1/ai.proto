syntax = "proto3";

package richter.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "richter/v1/interactions.proto";

option go_package = "example.com/buf/gen/richter/v1;richterv1";

enum AnalysisStatus {
  ANALYSIS_STATUS_UNSPECIFIED = 0;
  ANALYSIS_STATUS_PENDING = 1;
  ANALYSIS_STATUS_PROCESSING = 2;
  ANALYSIS_STATUS_DONE = 3;
  ANALYSIS_STATUS_ERROR = 4;
  // Stage 1 done: transcript + segments extracted; chunks not yet created.
  ANALYSIS_STATUS_TRANSCRIPT_EXTRACTED = 5;
  // Stage 2 done: chunks created; interactions not yet generated.
  ANALYSIS_STATUS_CHUNKS_READY = 6;
}

message TranscriptSegment {
  float start_seconds = 1;
  float end_seconds = 2;
  string text = 3;
}

message LessonAnalysis {
  string lesson_id = 1;
  AnalysisStatus status = 2;
  string transcript = 3;
  string error_msg = 4;
  repeated LessonInteraction interactions = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  repeated TranscriptSegment transcript_segments = 8;
  // Lesson-level default config for chunks without their own interaction_config.
  ChunkInteractionConfig default_interaction_config = 9;
}

// Strategy for distributing kinds when AI generates multiple interactions.
enum GenerationStrategy {
  GENERATION_STRATEGY_UNSPECIFIED = 0;
  // AI picks the most appropriate kind per question from the allowed list.
  GENERATION_STRATEGY_AI_CHOOSE = 1;
  // Distribute evenly across allowed kinds in order.
  GENERATION_STRATEGY_EVEN_DISTRIBUTION = 2;
}

// Per-chunk (or lesson-default) config for AI interaction generation.
message ChunkInteractionConfig {
  // Number of interactions to generate. 0 = use server default (2).
  int32 count = 1 [(buf.validate.field).int32 = {gte: 0, lte: 20}];
  // Allowed kinds for this chunk. Empty = use server default (MCQ only).
  repeated InteractionKind kinds = 2;
  // How to distribute among chosen kinds.
  GenerationStrategy strategy = 3;
}

message TranscriptChunk {
  string id = 1;
  string lesson_id = 2;
  int32 order_index = 3;
  float start_seconds = 4;
  float end_seconds = 5;
  string summary = 6;
  string transcript = 7;
  int32 question_count_config = 8;
  // Lexical-cohesion coverage score [0, 1] computed at chunking time and
  // refreshed when the chunk's segments change. Higher = chunk stays on one
  // topic. See coherence.go on the server for the exact formula.
  float coherence_score = 9;
  // Per-chunk AI generation config. Null = not configured; use lesson default.
  ChunkInteractionConfig interaction_config = 10;
}

message GetLessonAnalysisRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetLessonAnalysisResponse {
  LessonAnalysis analysis = 1;
  repeated TranscriptChunk chunks = 2;
}

enum AnalysisProgressStep {
  ANALYSIS_PROGRESS_STEP_UNSPECIFIED = 0;
  ANALYSIS_PROGRESS_STEP_DOWNLOADING = 1;
  ANALYSIS_PROGRESS_STEP_UPLOADING = 2;
  ANALYSIS_PROGRESS_STEP_ANALYZING = 3;
  ANALYSIS_PROGRESS_STEP_SAVING = 4;
  ANALYSIS_PROGRESS_STEP_DONE = 5;
  ANALYSIS_PROGRESS_STEP_ERROR = 6;
}

// ── Step 3: Edit transcript segments ─────────────────────────────────────────

message UpdateTranscriptSegmentRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
  int32 segment_index = 2 [(buf.validate.field).int32.gte = 0];
  string text = 3 [(buf.validate.field).string.min_len = 1];
}

message UpdateTranscriptSegmentResponse {
  TranscriptSegment segment = 1;
}

// ── Step 4: Chunk transcript ──────────────────────────────────────────────────

// (Removed: ChunkTranscriptRequest. The chunk step is now triggered via
// StartLessonTask with kind = LESSON_TASK_KIND_CHUNK_TRANSCRIPT.)

// ── Step 5: Edit chunks ───────────────────────────────────────────────────────

message ListLessonTranscriptChunksRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
  int32 limit = 2 [(buf.validate.field).int32 = {gte: 1, lte: 1000}];
  int32 offset = 3 [(buf.validate.field).int32.gte = 0];
}

message ListLessonTranscriptChunksResponse {
  repeated TranscriptChunk chunks = 1;
}

message UpdateChunkConfigRequest {
  string chunk_id = 1 [(buf.validate.field).string.uuid = true];
  int32 question_count = 2 [(buf.validate.field).int32 = {gte: 1, lte: 20}];
}

message UpdateChunkConfigResponse {
  TranscriptChunk chunk = 1;
}

message MergeChunksRequest {
  // The chunk to keep (its id will be retained, boundaries expanded).
  string keep_chunk_id = 1 [(buf.validate.field).string.uuid = true];
  // The adjacent chunk to absorb and delete.
  string discard_chunk_id = 2 [(buf.validate.field).string.uuid = true];
}

message MergeChunksResponse {
  TranscriptChunk merged_chunk = 1;
}

message DeleteChunkRequest {
  string chunk_id = 1 [(buf.validate.field).string.uuid = true];
}

message DeleteChunkResponse {}

// ── Step 5c: Split a chunk at a transcript-segment boundary ─────────────────

message SplitChunkRequest {
  string chunk_id = 1 [(buf.validate.field).string.uuid = true];
  // The start_seconds of the segment at which to begin the second chunk.
  float split_at_seconds = 2 [(buf.validate.field).float.gt = 0];
}

message SplitChunkResponse {
  TranscriptChunk first_chunk = 1;
  TranscriptChunk second_chunk = 2;
}

// ── Step 5d: Adjust the shared boundary between two adjacent chunks ──────────

message AdjustChunkBoundaryRequest {
  string prev_chunk_id = 1 [(buf.validate.field).string.uuid = true];
  string next_chunk_id = 2 [(buf.validate.field).string.uuid = true];
  // New boundary in seconds; must be between prevChunk.startSeconds and nextChunk.endSeconds.
  float new_boundary_seconds = 3 [(buf.validate.field).float.gt = 0];
}

message AdjustChunkBoundaryResponse {
  TranscriptChunk prev_chunk = 1;
  TranscriptChunk next_chunk = 2;
}

// ── Step 7: Generate interactions ────────────────────────────────────────────

enum GenerateInteractionsStep {
  GENERATE_INTERACTIONS_STEP_UNSPECIFIED = 0;
  GENERATE_INTERACTIONS_STEP_CHUNK = 1;
  GENERATE_INTERACTIONS_STEP_DONE = 2;
  GENERATE_INTERACTIONS_STEP_ERROR = 3;
}

message GenerateInteractionsRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
  // If non-empty, generate only for this chunk.
  string chunk_id = 2;
  // If true, regenerate even for chunks that already have interactions.
  bool force_regenerate = 3;
  // Deprecated: use interaction_kinds instead. Still honored for backward compat.
  InteractionKind interaction_kind = 4 [deprecated = true];
  // Allowed kinds for this generation run. Empty = use chunk/lesson config.
  repeated InteractionKind interaction_kinds = 5;
  // Override per-chunk count. 0 = use chunk/lesson config.
  int32 count_per_chunk = 6 [(buf.validate.field).int32 = {gte: 0, lte: 20}];
  // Strategy override. UNSPECIFIED = use chunk/lesson config.
  GenerationStrategy strategy = 7;
  // Custom difficulty level: "easy", "medium", "hard".
  string difficulty = 8;
  // Focus prompt focus to guide question content generation.
  string focus_prompt = 9;
}

// ── Durable lesson processing tasks ──────────────────────────────────────────

enum LessonTaskKind {
  LESSON_TASK_KIND_UNSPECIFIED = 0;
  LESSON_TASK_KIND_EXTRACT_TRANSCRIPT = 1;
  LESSON_TASK_KIND_CHUNK_TRANSCRIPT = 2;
  LESSON_TASK_KIND_GENERATE_INTERACTIONS = 3;
  // One-shot pipeline: transcribe → chunk → quiz_gen in a single task.
  LESSON_TASK_KIND_RUN_PIPELINE = 4;
}

enum LessonTaskStatus {
  LESSON_TASK_STATUS_UNSPECIFIED = 0;
  LESSON_TASK_STATUS_QUEUED = 1;
  LESSON_TASK_STATUS_RUNNING = 2;
  LESSON_TASK_STATUS_SUCCEEDED = 3;
  LESSON_TASK_STATUS_FAILED = 4;
  LESSON_TASK_STATUS_CANCELED = 5;
}

message LessonTask {
  string id = 1;
  string lesson_id = 2;
  string chunk_id = 3;
  LessonTaskKind kind = 4;
  LessonTaskStatus status = 5;
  string progress_step = 6;
  int32 progress_current = 7;
  int32 progress_total = 8;
  string message = 9;
  string error_msg = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
  google.protobuf.Timestamp started_at = 13;
  google.protobuf.Timestamp finished_at = 14;
  // Last heartbeat timestamp emitted by the worker. Used by the FE to
  // detect tasks whose worker has crashed without updating progress.
  // Empty if heartbeat emission is disabled or the task has not yet
  // emitted a heartbeat.
  google.protobuf.Timestamp last_heartbeat = 15;
}

message StartLessonTaskRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
  LessonTaskKind kind = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  GenerateInteractionsRequest generate_interactions = 3;
}

message StartLessonTaskResponse {
  LessonTask task = 1;
}

message GetLessonTaskRequest {
  string task_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetLessonTaskResponse {
  LessonTask task = 1;
}

message ListLessonTasksRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
  bool active_only = 2;
  int32 limit = 3 [(buf.validate.field).int32 = {gte: 1, lte: 100}];
  int32 offset = 4 [(buf.validate.field).int32.gte = 0];
}

message ListLessonTasksResponse {
  repeated LessonTask tasks = 1;
}

message ListAllTasksRequest {
  bool active_only = 1;
  int32 limit = 2 [(buf.validate.field).int32 = {gte: 1, lte: 100}];
  int32 offset = 3 [(buf.validate.field).int32.gte = 0];
}

message ListAllTasksResponse {
  repeated LessonTask tasks = 1;
  int64 total_active = 2;
  int64 total_succeeded = 3;
  int64 total_failed_or_canceled = 4;
}

message CancelLessonTaskRequest {
  string task_id = 1 [(buf.validate.field).string.uuid = true];
}

message CancelLessonTaskResponse {
  LessonTask task = 1;
}

// ── Chunk / lesson config update ─────────────────────────────────────────────

message UpdateChunkInteractionConfigRequest {
  string chunk_id = 1 [(buf.validate.field).string.uuid = true];
  // Pass null/empty to clear the config (revert to lesson default).
  ChunkInteractionConfig interaction_config = 2;
}

message UpdateChunkInteractionConfigResponse {
  TranscriptChunk chunk = 1;
}

message UpdateLessonDefaultInteractionConfigRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
  // Pass null/empty to clear the default.
  ChunkInteractionConfig default_interaction_config = 2;
}

message UpdateLessonDefaultInteractionConfigResponse {}

// ── Video watch progress (stored in FoundationDB) ─────────────────────────────

message UpdateWatchProgressRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
  // Current playback position in seconds.
  float position_seconds = 2 [(buf.validate.field).float.gte = 0];
}

message UpdateWatchProgressResponse {}

message GetWatchProgressRequest {
  string lesson_id = 1 [(buf.validate.field).string.uuid = true];
}

message GetWatchProgressResponse {
  // Last saved playback position in seconds. 0 if no progress recorded.
  float position_seconds = 1;
}

// ── Task input/output messages ──────────────────────────────────────────────
// Each task type defines its own Input/Output proto. The taskqueue
// stores these as serialized bytes in tasks.input_payload and
// tasks.output_payload (Postgres BYTEA). Executors marshal/unmarshal
// using proto.Marshal/proto.Unmarshal.

message TranscribeTaskInput {
  string lesson_id = 1;
}

message TranscribeTaskOutput {
  int64 completed_at = 1;  // unix seconds
}

message ChunkTaskInput {
  string lesson_id = 1;
}

message ChunkTaskOutput {
  int64 completed_at = 1;
}

message QuizGenTaskInput {
  string lesson_id = 1;
  string chunk_id = 2;  // empty = all chunks
  bool force_regenerate = 3;
  repeated InteractionKind interaction_kinds = 4;
  int32 count_per_chunk = 5;
  GenerationStrategy strategy = 6;
  string difficulty = 7;
  string focus_prompt = 8;
}

message QuizGenTaskOutput {
  int64 completed_at = 1;
  int32 interactions = 2;  // number of interactions generated
}

// Input/output for the one-shot pipeline task (kind=RUN_PIPELINE).
// Runs transcribe → chunk → quiz_gen sequentially in a single durable task.
message PipelineRunTaskInput {
  string lesson_id = 1;
  // Exercise generation config (mirrors QuizGenTaskInput fields).
  repeated InteractionKind interaction_kinds = 2;
  int32 count_per_chunk = 3;
  GenerationStrategy strategy = 4;
  string difficulty = 5;
  string focus_prompt = 6;
  bool force_regenerate = 7;
}

message PipelineRunTaskOutput {
  int64 completed_at = 1;
  int32 interactions = 2;  // number of interactions generated
}

service AIService {
  rpc GetLessonAnalysis(GetLessonAnalysisRequest) returns (GetLessonAnalysisResponse) {}

  // Step 3: Edit a single transcript segment (text only; boundaries unchanged).
  rpc UpdateTranscriptSegment(UpdateTranscriptSegmentRequest) returns (UpdateTranscriptSegmentResponse) {}

  // Step 5: Edit chunk configuration.
  rpc ListLessonTranscriptChunks(ListLessonTranscriptChunksRequest) returns (ListLessonTranscriptChunksResponse) {}
  rpc UpdateChunkConfig(UpdateChunkConfigRequest) returns (UpdateChunkConfigResponse) {}
  rpc MergeChunks(MergeChunksRequest) returns (MergeChunksResponse) {}
  rpc DeleteChunk(DeleteChunkRequest) returns (DeleteChunkResponse) {}
  rpc SplitChunk(SplitChunkRequest) returns (SplitChunkResponse) {}
  rpc AdjustChunkBoundary(AdjustChunkBoundaryRequest) returns (AdjustChunkBoundaryResponse) {}

  // Step 5e: Per-chunk and lesson-level AI generation config.
  rpc UpdateChunkInteractionConfig(UpdateChunkInteractionConfigRequest) returns (UpdateChunkInteractionConfigResponse) {}
  rpc UpdateLessonDefaultInteractionConfig(UpdateLessonDefaultInteractionConfigRequest) returns (UpdateLessonDefaultInteractionConfigResponse) {}

  // Durable task API used by clients to recover progress after reload/navigation.
  // Replaces the streaming RPCs (ExtractTranscriptStream / ChunkTranscriptStream /
  // GenerateInteractionsStream) that were removed in this revision.
  rpc StartLessonTask(StartLessonTaskRequest) returns (StartLessonTaskResponse) {}
  rpc GetLessonTask(GetLessonTaskRequest) returns (GetLessonTaskResponse) {}
  rpc ListLessonTasks(ListLessonTasksRequest) returns (ListLessonTasksResponse) {}
  rpc ListAllTasks(ListAllTasksRequest) returns (ListAllTasksResponse) {}
  rpc CancelLessonTask(CancelLessonTaskRequest) returns (CancelLessonTaskResponse) {}

  // Video watch progress — stored in FoundationDB, not PostgreSQL.
  rpc UpdateWatchProgress(UpdateWatchProgressRequest) returns (UpdateWatchProgressResponse) {}
  rpc GetWatchProgress(GetWatchProgressRequest) returns (GetWatchProgressResponse) {}
}
