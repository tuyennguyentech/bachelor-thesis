# version: '3'
name: dyadia
services:
  fdb-coordinator:
    image: foundationdb/foundationdb:${FDB_VERSION}
    ports:
      - 4500:4500/tcp
    environment:
      FDB_COORDINATOR: ${FDB_COORDINATOR}
      FDB_NETWORKING_MODE: ${FDB_NETWORKING_MODE}
      FDB_COORDINATOR_PORT: ${FDB_COORDINATOR_PORT}
    platform: "linux/amd64"
    # Portable data: bind-mount into the working tree (volumes/) instead of an
    # anonymous volume, so the whole dataset travels with the repo. :U makes
    # podman chown the bind to the container user on each mount (portable across
    # machines with different rootless uid maps); :Z relabels for SELinux.
    volumes:
      - ./volumes/fdb-coordinator:/var/fdb/data:U,Z
    # STATIC IP: in FDB_NETWORKING_MODE=container the process advertises `hostname -i`
    # (its container IP) as its PUBLIC address, and that address is baked into the
    # persisted coordination state (coordination-*.fdq). A dynamic IP therefore breaks
    # the cluster on ANY restart with a new IP (k8s pod reschedule, another machine,
    # `compose rm`+`up`) even with the data volume intact. Pinning the coordinator to a
    # fixed IP keeps the persisted state valid → the cluster reforms from the copied/
    # remounted volume with NO reconfigure. High-range IPs avoid the dynamic pool.
    networks:
      default:
        ipv4_address: 10.89.1.200

  fdb-server-1:
    depends_on:
      - fdb-coordinator
    image: foundationdb/foundationdb:${FDB_VERSION}
    environment:
      FDB_COORDINATOR: ${FDB_COORDINATOR}
      FDB_NETWORKING_MODE: ${FDB_NETWORKING_MODE}
      FDB_COORDINATOR_PORT: ${FDB_COORDINATOR_PORT}
    platform: "linux/amd64"
    volumes:
      - ./volumes/fdb-server-1:/var/fdb/data:U,Z
    networks:
      default:
        ipv4_address: 10.89.1.201

  fdb-server-2:
    depends_on:
      - fdb-coordinator
    image: foundationdb/foundationdb:${FDB_VERSION}
    environment:
      FDB_COORDINATOR: ${FDB_COORDINATOR}
      FDB_NETWORKING_MODE: ${FDB_NETWORKING_MODE}
      FDB_COORDINATOR_PORT: ${FDB_COORDINATOR_PORT}
    platform: "linux/amd64"
    volumes:
      - ./volumes/fdb-server-2:/var/fdb/data:U,Z
    networks:
      default:
        ipv4_address: 10.89.1.202

  # fdb-init: one-shot sidecar that makes a freshly-created FDB cluster CONFIGURED
  # automatically (config-driven, no manual root step). A brand-new/empty FDB data dir
  # is UNCONFIGURED — every transaction times out with error 1031 — until
  # `configure new single ssd` runs once. This sidecar does that on `up`; it is
  # IDEMPOTENT — if the cluster is already available (e.g. a copied-in configured data
  # dir) it exits without changing anything, so it never wipes existing data.
  # (Rootless `podman exec fdbcli configure` works fine — verified — so no root needed.)
  fdb-init:
    image: foundationdb/foundationdb:${FDB_VERSION}
    depends_on:
      - fdb-coordinator
      - fdb-server-1
      - fdb-server-2
    environment:
      FDB_COORDINATOR: ${FDB_COORDINATOR}
      FDB_NETWORKING_MODE: ${FDB_NETWORKING_MODE}
      FDB_COORDINATOR_PORT: ${FDB_COORDINATOR_PORT}
    volumes:
      - ./scripts/init/fdb:/init:ro,Z
    entrypoint: ["/bin/bash", "/init/configure.sh"]
    restart: "no"

  postgres:
    image: postgres:18.3-alpine3.23
    environment:
      - POSTGRES_PASSWORD=dyadia
      - POSTGRES_USER=dyadia
      - POSTGRES_DB=dyadia
    ports:
      - 5432:5432
    volumes:
      - ./scripts/init/postgresql:/docker-entrypoint-initdb.d:Z
      # Postgres data dir (was an anonymous volume at /var/lib/postgresql). The
      # entrypoint runs as root and re-chowns PGDATA to the postgres user, so :U
      # (chown bind to container root) keeps it portable across machines.
      - ./volumes/postgres:/var/lib/postgresql:U,Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dyadia -d dyadia"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  caddy:
    image: caddy:2.11.2-alpine
    cap_add:
      - NET_ADMIN
    # Publish on unprivileged host ports → Caddy still listens on :80/:443 inside the
    # container. Avoids the rootless low-port bind on the host, so the stack is
    # portable to another machine with no `sysctl ip_unprivileged_port_start` step.
    # HTTP  → http://localhost:8080   (container :80)
    # HTTPS → https://localhost:8443  (container :443, Caddy internal-CA cert)
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./conf/caddy:/etc/caddy:Z
      - ./volumes/caddy-data:/data:U,Z
      - ./volumes/caddy-config:/config:U,Z

  storage:
    image: chrislusf/seaweedfs:3.88
    command: server -s3 -s3.port=9000 -dir=/data -s3.allowEmptyFolder=false -s3.config=/config/s3.json
    ports:
      - "9000:9000"
    volumes:
      - ./volumes/seaweedfs:/data:U,Z
      - ./conf/seaweedfs:/config:Z

  debug:
    image: alpine/curl
    tty: true
    stdin_open: true
    command: sh

  speaches:
    # The BASE stack is always CPU. GPU is enabled SOLELY by applying the
    # self-sufficient overlay (compose.gpu.yml), which overrides the image,
    # inference device, and attaches the CDI device. This avoids the footgun of a
    # half-switched state (cuda image with no GPU attached). There is intentionally
    # no AI_DEVICE knob here — see docs/infra/podman-gpu.md.
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    environment:
      WHISPER__INFERENCE_DEVICE: cpu
      # float16 is efficient on CUDA but unsupported on CPU (falls back to float32).
      # "default" lets CTranslate2 pick the best quantization for the active device.
      WHISPER__COMPUTE_TYPE: default
      # Number of parallel STT (Whisper) inference workers in speaches. Keep in
      # sync with the richter-side cap RICHTER_AI_STT_MAX_CONCURRENT (both from .env).
      WHISPER__NUM_WORKERS: ${WHISPER__NUM_WORKERS:-1}
      # STT model preloaded into memory at boot. Single source: RICHTER_STT_MODEL in .env.
      PRELOAD_MODELS: '["${RICHTER_STT_MODEL:-Systran/faster-whisper-small}"]'
    volumes:
      # HuggingFace model cache (Whisper + Piper), bind-mounted under volumes like
      # all other persistent data. The speaches image declares `USER ubuntu`
      # (uid 1000), so :U chowns the bind to 1000 — writable by the runtime user
      # (verified). Keeping it in volumes means the downloaded models travel with
      # the portable dataset (no re-download on a copied-in stack); on a brand-new
      # empty dir, speaches-init pulls them on first `up`.
      - ./volumes/hf-cache:/home/ubuntu/.cache/huggingface/hub:U,Z
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://0.0.0.0:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # One-shot init: pulls the Piper TTS models Speaches serves at /v1/audio/speech
  # so the first synthesis is not blocked on a cold download. Mirrors the Postgres
  # init pattern (scripts/init/<service>) — Speaches is a third-party image with no
  # entrypoint hook, so this sidecar runs the script once after Speaches is healthy.
  speaches-init:
    image: alpine/curl
    depends_on:
      speaches:
        condition: service_healthy
    volumes:
      - ./scripts/init/speaches:/init:ro,Z
    environment:
      # Single source for the models: RICHTER_STT_MODEL / RICHTER_TTS_* in .env
      # (same vars richter reads). The STT model MUST be pulled here — Speaches'
      # PRELOAD_MODELS only loads an already-downloaded model, so after a volume
      # wipe transcription 404s until this sidecar fetches it.
      SPEACHES_URL: ${RICHTER_TTS_ENDPOINT:-http://speaches:8000}
      STT_MODEL: ${RICHTER_STT_MODEL:-Systran/faster-whisper-small}
      TTS_VI_MODEL: ${RICHTER_TTS_VI_MODEL:-speaches-ai/piper-vi_VN-vais1000-medium}
      TTS_EN_MODEL: ${RICHTER_TTS_EN_MODEL:-speaches-ai/piper-en_US-lessac-medium}
    entrypoint: ["sh", "/init/preload-tts.sh"]
    restart: "no"

  # NOTE: database migrations are a DEVELOPER task, run explicitly with goose — NOT
  # automated by a sidecar. On a fresh/empty Postgres data dir, bring the schema up
  # before seeding/using the app:
  #   ./scripts/setup/environment.dev/container-shell.sh richter -- \
  #     ./scripts/setup/environment.dev/goose.sh dev up
  # A copied-in portable data dir is already migrated, so nothing is needed there.

  # richter/heino run as HOST processes via container-shell.sh (which sources .env),
  # so these are network-namespace placeholders. env_file is declared so the env
  # also applies if/when they run as real containers (prod), keeping one source of truth.
  richter:
    image: busybox:musl
    command: ["sleep", "infinity"]
    env_file:
      - .env

  heino:
    image: busybox:musl
    command: ["sleep", "infinity"]
    env_file:
      - .env

# Fixed subnet so the FDB processes can hold stable static IPs (10.89.1.200-202) —
# required for FDB's persisted coordination state to survive restarts / remounts /
# machine moves. Other services keep dynamic IPs (podman avoids the reserved statics).
networks:
  default:
    ipam:
      config:
        - subnet: 10.89.1.0/24
          gateway: 10.89.1.1

# All persistent DATA (postgres, fdb, seaweedfs, caddy, speaches model cache) is
# bind-mounted under ./volumes/ so the seeded dataset travels with the repo.
# There are no named volumes.
