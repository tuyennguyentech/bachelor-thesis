# version: '3'
name: dyadia
services:
  fdb-coordinator:
    image: foundationdb/foundationdb:${FDB_VERSION}
    ports:
      - 4500:4500/tcp
    environment:
      FDB_COORDINATOR: ${FDB_COORDINATOR}
      FDB_NETWORKING_MODE: ${FDB_NETWORKING_MODE}
      FDB_COORDINATOR_PORT: ${FDB_COORDINATOR_PORT}
    platform: "linux/amd64"

  fdb-server-1:
    depends_on:
      - fdb-coordinator
    image: foundationdb/foundationdb:${FDB_VERSION}
    environment:
      FDB_COORDINATOR: ${FDB_COORDINATOR}
      FDB_NETWORKING_MODE: ${FDB_NETWORKING_MODE}
      FDB_COORDINATOR_PORT: ${FDB_COORDINATOR_PORT}
    platform: "linux/amd64"

  fdb-server-2:
    depends_on:
      - fdb-coordinator
    image: foundationdb/foundationdb:${FDB_VERSION}
    environment:
      FDB_COORDINATOR: ${FDB_COORDINATOR}
      FDB_NETWORKING_MODE: ${FDB_NETWORKING_MODE}
      FDB_COORDINATOR_PORT: ${FDB_COORDINATOR_PORT}
    platform: "linux/amd64"

  postgres:
    image: postgres:18.3-alpine3.23
    environment:
      - POSTGRES_PASSWORD=dyadia
      - POSTGRES_USER=dyadia
      - POSTGRES_DB=dyadia
    ports:
      - 5432:5432
    volumes:
      - ./scripts/init/postgresql:/docker-entrypoint-initdb.d:Z

  caddy:
    image: caddy:2.11.2-alpine
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./conf/caddy:/etc/caddy:Z
      - caddy_data:/data
      - caddy_config:/config

  storage:
    image: chrislusf/seaweedfs:3.88
    command: server -s3 -s3.port=9000 -dir=/data -s3.allowEmptyFolder=false -s3.config=/config/s3.json
    ports:
      - "9000:9000"
    volumes:
      - storage_data:/data
      - ./conf/seaweedfs:/config:Z

  debug:
    image: alpine/curl
    tty: true
    stdin_open: true
    command: sh

  speaches:
    # AI_DEVICE selects the compute backend: "cpu" (default) or "cuda".
    # The image tag must match: latest-cpu for CPU, latest-cuda for GPU.
    # Set AI_DEVICE in .env and apply compose.gpu.yml for GPU device reservations.
    image: ghcr.io/speaches-ai/speaches:latest-${AI_DEVICE:-cpu}
    environment:
      WHISPER__INFERENCE_DEVICE: ${AI_DEVICE:-cpu}
      # float16 is efficient on CUDA but unsupported on CPU (falls back to float32).
      # "default" lets CTranslate2 pick the best quantization for the active device.
      WHISPER__COMPUTE_TYPE: default
      # Number of parallel Whisper inference workers. Keep in sync with the
      # richter-side cap RICHTER_AI_WHISPER_MAX_CONCURRENT (both from .env).
      WHISPER__NUM_WORKERS: ${WHISPER__NUM_WORKERS:-1}
      PRELOAD_MODELS: '["Systran/faster-whisper-small"]'
    volumes:
      - hf_hub_cache:/home/ubuntu/.cache/huggingface/hub
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://0.0.0.0:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  piper-tts:
    build:
      context: infra/piper
      # GPU build: install onnxruntime-gpu instead of onnxruntime (CPU-only).
      # Compose.gpu.yml sets USE_CUDA_RUNTIME=1 to activate this build arg.
      args:
        USE_CUDA_RUNTIME: "0"
    environment:
      PIPER_MODELS_DIR: /models
      # Set to "1" (via compose.gpu.yml) to enable CUDA inference in piper.
      PIPER_USE_CUDA: "0"
      # Max concurrent TTS syntheses. Keep in sync with the richter-side cap
      # RICHTER_AI_PIPER_MAX_CONCURRENT (both from .env). 0 = unlimited.
      PIPER_NUM_WORKERS: ${PIPER_NUM_WORKERS:-0}
    volumes:
      - piper_models:/models
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 300s

  richter:
    image: busybox:musl
    command: ["sleep", "infinity"]

  heino:
    image: busybox:musl
    command: ["sleep", "infinity"]

volumes:
  caddy_data:
  caddy_config:
  storage_data:
  hf_hub_cache:
  piper_models:
