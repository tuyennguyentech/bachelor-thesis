# version: '3'
name: dyadia
services:
  fdb-coordinator:
    image: foundationdb/foundationdb:${FDB_VERSION}
    ports:
      - 4500:4500/tcp
    environment:
      FDB_COORDINATOR: ${FDB_COORDINATOR}
      FDB_NETWORKING_MODE: ${FDB_NETWORKING_MODE}
      FDB_COORDINATOR_PORT: ${FDB_COORDINATOR_PORT}
    platform: "linux/amd64"

  fdb-server-1:
    depends_on:
      - fdb-coordinator
    image: foundationdb/foundationdb:${FDB_VERSION}
    environment:
      FDB_COORDINATOR: ${FDB_COORDINATOR}
      FDB_NETWORKING_MODE: ${FDB_NETWORKING_MODE}
      FDB_COORDINATOR_PORT: ${FDB_COORDINATOR_PORT}
    platform: "linux/amd64"

  fdb-server-2:
    depends_on:
      - fdb-coordinator
    image: foundationdb/foundationdb:${FDB_VERSION}
    environment:
      FDB_COORDINATOR: ${FDB_COORDINATOR}
      FDB_NETWORKING_MODE: ${FDB_NETWORKING_MODE}
      FDB_COORDINATOR_PORT: ${FDB_COORDINATOR_PORT}
    platform: "linux/amd64"

  postgres:
    image: postgres:18.3-alpine3.23
    environment:
      - POSTGRES_PASSWORD=dyadia
      - POSTGRES_USER=dyadia
      - POSTGRES_DB=dyadia
    ports:
      - 5432:5432
    volumes:
      - ./scripts/init/postgresql:/docker-entrypoint-initdb.d:Z

  caddy:
    image: caddy:2.11.2-alpine
    cap_add:
      - NET_ADMIN
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./conf/caddy:/etc/caddy:Z
      - caddy_data:/data
      - caddy_config:/config

  storage:
    image: chrislusf/seaweedfs:3.88
    command: server -s3 -s3.port=9000 -dir=/data -s3.allowEmptyFolder=false -s3.config=/config/s3.json
    ports:
      - "9000:9000"
    volumes:
      - storage_data:/data
      - ./conf/seaweedfs:/config:Z

  debug:
    image: alpine/curl
    tty: true
    stdin_open: true
    command: sh

  speaches:
    image: ghcr.io/speaches-ai/speaches:latest-cpu
    environment:
      WHISPER__INFERENCE_DEVICE: cpu
      PRELOAD_MODELS: '["Systran/faster-whisper-small"]'
    volumes:
      - hf_hub_cache:/home/ubuntu/.cache/huggingface/hub
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://0.0.0.0:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  richter:
    image: busybox:musl
    command: ["sleep", "infinity"]

  heino:
    image: busybox:musl
    command: ["sleep", "infinity"]

volumes:
  caddy_data:
  caddy_config:
  storage_data:
  hf_hub_cache:
