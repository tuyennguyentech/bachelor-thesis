[lesson_task]
# 0 = auto = runtime.NumCPU() (Go's best practice for CPU-bound work).
# Set a positive integer to pin the worker count for production sizing.
workers = 0
max_active_per_user = 3
# 0 = unlimited (never mark stale). 2m is a compromise: long enough for
# short videos, short enough that a worker crash doesn't leave the UI
# stuck in "syncing" for the user's whole session.
active_timeout = "2m"
poll_interval = "2s"
stale_check_interval = "1m"
# Heartbeat emission interval. Workers write a timestamp to the task record
# on every progress tick. 0 = disabled (no heartbeat emission).
heartbeat_interval = "15s"
# Heartbeat timeout. Tasks whose last heartbeat is older than this are
# marked FAILED on server startup (ReclaimDeadTasks). 0 = disabled.
heartbeat_timeout = "1m"

[storage]
# Student audio presigned-upload rate limit (per user, per lesson, rolling window).
# student_uploads_per_window = 0 disables the rate limit entirely.
# Dev + test loops share the "unlimited" value here; production should
# override via env var RICHTER_STORAGE_STUDENT_UPLOADS_PER_WINDOW.
student_uploads_per_window = 0
student_upload_window = "1m"

[ai]
# All durations accept 0 = unlimited (no deadline). Values < 0 are
# clamped to 0 by the service layer. Defaults match sane production
# values; override via env RICHTER_AI_<KEY>.
whisper_client_timeout         = "10m"
whisper_idle_conn_timeout      = "90s"
whisper_response_header_timeout = "5m"
whisper_max_idle_conns_per_host = 10
download_timeout               = "5m"
audio_extract_timeout          = "3m"
whisper_request_timeout        = "10m"
whisper_progress_interval      = "20s"
# Cap concurrent in-flight Whisper requests across the process to
# prevent the default speaches deployment from being overwhelmed
# under parallel transcribe (most common cause of "timeout awaiting
# response headers" failures). 0 = unlimited.
whisper_max_concurrent         = 1
# Semaphore chặn TTS (Piper) đồng thời ở richter — cặp với PIPER_NUM_WORKERS.
# 0 = unlimited. Default; override bằng RICHTER_AI_PIPER_MAX_CONCURRENT trong .env.
piper_max_concurrent           = 0
# ── ĐỘ ĐỒNG THỜI AI LOCAL — cấu hình TẬP TRUNG ở .env, KHÔNG chỉnh số ở file này ──
# 2 dòng *_max_concurrent trên CHỈ là default. Mỗi service AI local có 1 CẶP:
# cap ở richter (app-side semaphore) + số workers ở service. Đặt trong .env, để cặp bằng nhau:
#   Whisper: RICHTER_AI_WHISPER_MAX_CONCURRENT  +  WHISPER__NUM_WORKERS
#   Piper:   RICHTER_AI_PIPER_MAX_CONCURRENT    +  PIPER_NUM_WORKERS
# richter đọc RICHTER_AI_* qua viper (SetEnvPrefix("richter") + '.'→'_' + AutomaticEnv,
#   ⇒ override [ai].whisper_max_concurrent / [ai].piper_max_concurrent);
# speaches/piper lấy WHISPER__NUM_WORKERS / PIPER_NUM_WORKERS qua compose nội suy ${...} từ .env.
#
# QUAN TRỌNG về nơi env có hiệu lực:
#  • Container thật / CI (compose `env_file: .env` hoặc `environment: ${...}`): nhận env trực tiếp.
#  • Dev qua scripts/.../container-shell.sh: script chỉ `nsenter -n` (MƯỢN network
#    namespace) — KHÔNG `podman exec`, nên KHÔNG kế thừa env của container; tiến trình
#    `go run` đọc env của SHELL HOST. ⇒ phải nạp .env vào shell trước khi chạy:
#        set -a; source .env; set +a
#    (hoặc thêm `source .env` vào container-shell.sh). Không nạp thì default ở trên được dùng.
# Total wall-clock budget for the full extract pipeline
# (download + ffmpeg + Whisper). Guards against hung sub-stages.
# 0 = unlimited (rely on per-stage timeouts only).
# Default: generous 33 min = DownloadTimeout + AudioExtractTimeout +
# WhisperRequestTimeout + 5 min buffer.
pipeline_timeout               = "33m"
# Maximum video file size accepted at download time.
# 0 = use built-in default (2 GB). Override for smaller deployments.
# E.g. 536870912 = 512 MB; 2147483648 = 2 GB.
max_video_bytes                = 0
# Directory for video/audio temp files. Empty = os.TempDir() (system
# default /tmp). Point at a dedicated volume for large-video workloads.
temp_dir                       = ""
chunking_timeout               = "3m"
interaction_gen_timeout        = "2m"
tts_request_timeout            = "2m"
background_task_timeout        = "5s"
list_limit_chunks              = 500
list_limit_interactions        = 5000
list_limit_lesson_ops          = 10000

[interactions]
# 0 = unlimited (no deadline).
grading_timeout = "25s"
list_limit      = 500

[lessons]
list_limit = 10000

