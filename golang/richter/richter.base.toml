[stt]
endpoint = "speaches:8000"
model = "Systran/faster-whisper-small"
# Spoken-language hint for the source AUDIO (ISO-639-1, e.g. "vi", "en"). This is
# the language SPOKEN in the video — NOT the lesson's output language (which lives
# on each lesson and controls the generated questions/exercises). Empty = Whisper
# auto-detect; pin it to the audio language to avoid mis-detection (e.g. a
# Vietnamese clip transcribed as English). Override per env via RICHTER_STT_LANGUAGE.
language = ""

# Text-to-speech via Speaches' OpenAI-compatible /v1/audio/speech. Each language
# maps to a Piper model + voice. The vi/en models are pre-pulled at compose up by
# scripts/init/speaches/preload-tts.sh.
[tts]
endpoint = "http://speaches:8000"
vi_model = "speaches-ai/piper-vi_VN-vais1000-medium"
vi_voice = "vais1000"
en_model = "speaches-ai/piper-en_US-lessac-medium"
en_voice = "lessac"

[gemini]
api_key = ""
model = "gemini-3.1-flash-lite"

[fdb]
cluster_file = "fdb.cluster"
api_version = 730

[lesson_task]
# 0 = auto = runtime.NumCPU() (Go's best practice for CPU-bound work).
# Set a positive integer to pin the worker count for production sizing.
workers = 0
max_active_per_user = 3
# 0 = unlimited (never mark stale). 2m is a compromise: long enough for
# short videos, short enough that a worker crash doesn't leave the UI
# stuck in "syncing" for the user's whole session.
active_timeout = "2m"
poll_interval = "2s"
stale_check_interval = "1m"
# Heartbeat emission interval. Workers write a timestamp to the task record
# on every progress tick. 0 = disabled (no heartbeat emission).
heartbeat_interval = "15s"
# Heartbeat timeout. Tasks whose last heartbeat is older than this are
# marked FAILED on server startup (ReclaimDeadTasks). 0 = disabled.
heartbeat_timeout = "1m"

[storage]
# Student audio presigned-upload rate limit (per user, per lesson, rolling window).
# student_uploads_per_window = 0 disables the rate limit entirely.
# Dev + test loops share the "unlimited" value here; production should
# override via env var RICHTER_STORAGE_STUDENT_UPLOADS_PER_WINDOW.
student_uploads_per_window = 0
student_upload_window = "1m"

[ai]
# All durations accept 0 = unlimited (no deadline). Values < 0 are
# clamped to 0 by the service layer. Defaults match sane production
# values; override via env RICHTER_AI_<KEY>.
# ── PHIÊN ÂM VIDEO DÀI (> 1h) ─────────────────────────────────────────────
# Audio được tách thẳng thành các đoạn WAV ≤ stt_segment_seconds (1 lần
# ffmpeg, ghi ra ĐĨA, KHÔNG bao giờ giữ WAV nguyên bài trong RAM), rồi phiên
# âm từng đoạn như 1 request riêng và ghép lại (offset timestamp theo độ dài
# thực mỗi đoạn). Nhờ vậy thời gian + bộ nhớ mỗi request luôn có cận, xử lý
# được video dài tuỳ ý. Các *_timeout dưới đây vì thế là cận CHO MỖI ĐOẠN.
# 0 = tắt cắt đoạn (1 request cho cả bài — chỉ an toàn với clip ngắn).
stt_segment_seconds        = 600
stt_client_timeout         = "30m"
stt_idle_conn_timeout      = "90s"
# 0 = tắt. speaches /v1/audio/transcriptions KHÔNG streaming: chỉ gửi header
# SAU khi phiên âm xong cả đoạn, nên header-timeout sẽ giết nhầm đoạn chậm mà
# vẫn khoẻ. Dùng stt_request_timeout làm cận thực sự thay cho nó.
stt_response_header_timeout = "0s"
stt_max_idle_conns_per_host = 10
download_timeout               = "10m"
audio_extract_timeout          = "15m"
stt_request_timeout        = "30m"
stt_progress_interval      = "20s"
# Cap concurrent in-flight STT requests across the process to
# prevent the default speaches deployment from being overwhelmed
# under parallel transcribe (most common cause of "timeout awaiting
# response headers" failures). 0 = unlimited.
#
# CỐ Ý comment 2 dòng *_max_concurrent dưới đây: giá trị thực BẮT BUỘC đến từ biến
# môi trường (RICHTER_AI_STT_MAX_CONCURRENT / RICHTER_AI_TTS_MAX_CONCURRENT trong
# .env), vì cap app-side ở richter phải khớp 1:1 với số worker của speaches
# (WHISPER__NUM_WORKERS) mà compose nội suy từ CÙNG file .env. Env LUÔN override
# giá trị trong toml (viper AutomaticEnv), nên đặt số cứng ở đây chỉ gây hiểu nhầm /
# sai lệch với giá trị đang chạy thật (ví dụ file ghi 1 nhưng thực tế là 4). Khi
# KHÔNG có env, viper fallback về default khai báo trong cfg/ai.go (STT=1, TTS=0).
# stt_max_concurrent       = 1
# tts_max_concurrent       = 0
# ── ĐỘ ĐỒNG THỜI AI LOCAL — cấu hình TẬP TRUNG ở .env, KHÔNG chỉnh số ở file này ──
# 2 dòng *_max_concurrent trên CHỈ là default. Mỗi service AI local có 1 CẶP:
# cap ở richter (app-side semaphore) + số workers ở service. Đặt trong .env, để cặp bằng nhau:
#   Whisper (STT): RICHTER_AI_STT_MAX_CONCURRENT  +  WHISPER__NUM_WORKERS
#   TTS (Speaches): RICHTER_AI_TTS_MAX_CONCURRENT  (Speaches phục vụ cả STT lẫn TTS)
# richter đọc RICHTER_AI_* qua viper (SetEnvPrefix("richter") + '.'→'_' + AutomaticEnv,
#   ⇒ override [ai].stt_max_concurrent / [ai].tts_max_concurrent);
# speaches lấy WHISPER__NUM_WORKERS qua compose nội suy ${...} từ .env.
#
# QUAN TRỌNG về nơi env có hiệu lực:
#  • Container thật / CI (compose `env_file: .env` hoặc `environment: ${...}`): nhận env trực tiếp.
#  • Dev qua scripts/.../container-shell.sh: script chỉ `nsenter -n` (MƯỢN network
#    namespace) — KHÔNG `podman exec`, nên KHÔNG kế thừa env của container; tiến trình
#    `go run` đọc env của SHELL HOST. ⇒ phải nạp .env vào shell trước khi chạy:
#        set -a; source .env; set +a
#    (hoặc thêm `source .env` vào container-shell.sh). Không nạp thì default ở trên được dùng.
# Tổng ngân sách wall-clock cho cả pipeline (download + ffmpeg + STT).
# 0 = unlimited — KHUYẾN NGHỊ cho video dài: đặt số cố định sẽ chặn nhầm video
# dài hơn ngưỡng đó (vd 33m sẽ giết 1 video 1h khi đang phiên âm dở). Mỗi
# stage đã có cận riêng (download_timeout, audio_extract_timeout, và
# stt_request_timeout cho TỪNG đoạn) nên không stage nào treo vô hạn.
# Chỉ đặt > 0 nếu muốn áp trần cứng cho tổng thời gian xử lý.
pipeline_timeout               = "0s"
# Maximum video file size accepted at download time.
# 0 = use built-in default (2 GB). Override for smaller deployments.
# E.g. 536870912 = 512 MB; 2147483648 = 2 GB.
max_video_bytes                = 0
# Directory for video/audio temp files. Empty = os.TempDir() (system
# default /tmp). Point at a dedicated volume for large-video workloads.
temp_dir                       = ""
chunking_timeout               = "3m"
interaction_gen_timeout        = "2m"
tts_request_timeout            = "2m"
# Interactive audio-grading STT bound (a student waiting) — must NOT inherit the
# 30m video-transcription timeout. 90s is generous (CPU STT ~10s, GPU ~1.5s).
audio_grade_stt_timeout        = "90s"
# Watch-coverage anti-tamper: CUMULATIVE marked coverage <= grace + max_rate ×
# real seconds since first watch. max_rate must exceed the max legit playback
# speed (4.0 covers up to 4x) so honest fast viewers are not undercounted.
watch_coverage_max_rate                = 4.0
watch_coverage_initial_grace_seconds   = 30
background_task_timeout        = "5s"
list_limit_chunks              = 500
list_limit_interactions        = 5000
list_limit_lesson_ops          = 10000
# Retry transient Gemini failures (429 rate-limit / 503 overloaded / 5xx /
# degraded empty result) with linear backoff so real multi-user bursts past the
# per-minute quota recover instead of failing the task.
gemini_max_attempts            = 4
gemini_retry_backoff           = "8s"

[interactions]
# 0 = unlimited (no deadline).
grading_timeout = "25s"
list_limit      = 500

[lessons]
list_limit = 10000

